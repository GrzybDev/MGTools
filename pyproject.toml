[project]
name = "mgtools"
version = "0.1.0"
description = "Collection of various tools for PC ports of Metal Gear / Metal Gear 2: Solid Snake!"
authors = [
    {name = "Marek Grzyb",email = "marek@grzyb.dev"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.md",
]
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.1.1",
    "polib",
    "typer>=0.24.0",
]

[tool.uv]
package = true

[tool.uv.sources]
polib = { git = "https://github.com/GrzybDev/polib.git", rev = "state-machine-fix" }

[project.scripts]
mgtools = "mgtools:app"
