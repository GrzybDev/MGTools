[project]
name = "mgtools"
version = "0.1.0"
description = "Collection of various tools for PC ports of Metal Gear / Metal Gear 2: Solid Snake!"
authors = [
    {name = "Marek Grzyb",email = "marek@grzyb.dev"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.md",
]
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.3.0",
    "translate-toolkit>=3.17.5",
    "typer>=0.24.0",
]

[tool.uv]
package = true

[project.scripts]
mgtools = "mgtools:app"
